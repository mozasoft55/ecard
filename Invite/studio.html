<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b0712">
  <title>Invitation Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #35151b;
      --wine: #6f0f1c;
      --gold: #c9a24a;
      --paper: #fffaf2;
      --muted: #76666a;
      font-family: "Playfair Display", Georgia, serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: #f3eee8; }
    button, input, select { font: inherit; }
    .topbar { padding: 18px clamp(16px, 4vw, 40px); background: #3b0712; color: #f7e5b5; }
    .topbar a { color: inherit; text-decoration: none; }
    .topbar h1 { margin: 0; font-size: 1.25rem; }
    .topbar p { margin: 5px 0 0; color: #e5d4bd; font: 0.9rem "Cormorant Garamond", Georgia, serif; }
    .layout { display: grid; grid-template-columns: minmax(280px, 390px) minmax(0, 1fr); gap: 22px; max-width: 1440px; margin: 0 auto; padding: 22px; }
    .panel, .preview-panel { min-width: 0; border: 1px solid #dfd3c7; border-radius: 16px; background: var(--paper); box-shadow: 0 12px 34px #35151b12; }
    .panel { padding: 22px; }
    .panel h2, .preview-panel h2 { margin: 0 0 14px; color: var(--wine); font-size: 1.15rem; }
    .notice { margin: 0 0 18px; padding: 11px 12px; border-left: 3px solid var(--gold); background: #faf1dc; color: #55453f; font: 0.92rem/1.45 "Cormorant Garamond", Georgia, serif; }
    .field { display: grid; gap: 6px; margin: 12px 0; }
    .field label, legend { color: #58313a; font-size: 0.84rem; font-weight: 700; }
    .field input, .field select { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #cdbda9; border-radius: 8px; background: white; color: var(--ink); }
    .field input:focus, .field select:focus, button:focus-visible, a:focus-visible { outline: 3px solid #d5b464; outline-offset: 2px; }
    fieldset { margin: 16px 0 0; padding: 0; border: 0; }
    legend { margin-bottom: 4px; }
    .events { display: grid; gap: 10px; }
    .event-editor { padding: 11px; border: 1px solid #e2d6c8; border-radius: 10px; background: #fffdf9; }
    .event-editor h3 { margin: 0 0 8px; font-size: 0.88rem; }
    .event-editor-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .event-editor-head button, #add-event { min-height:34px; padding:5px 10px; border:1px solid var(--gold); border-radius:999px; background:white; color:var(--wine); cursor:pointer; }
    .event-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .event-grid input { min-width: 0; min-height: 38px; padding: 7px; border: 1px solid #d5c9bb; border-radius: 7px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .toolbar h2 { margin: 0; }
    .preview-frame { display: block; width: 100%; height: min(78vh, 850px); min-height: 520px; border: 0; border-radius: 12px; background: #17050a; }
    .error { padding: 22px; color: #8c1e2c; }
    @media (max-width: 850px) {
      .layout { grid-template-columns: minmax(0, 1fr); padding: 14px; }
      .preview-frame { height: 72vh; min-height: 520px; }
    }
    @media (max-width: 420px) {
      .panel { padding: 16px; }
      .layout { padding: 10px; }
      .preview-frame { min-height: 440px; }
    }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      body { background: #fff; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .topbar, .panel, .toolbar { display: none !important; }
      .layout { display: block; margin: 0; padding: 0; }
      .preview-panel { display: block; border: 0; border-radius: 0; padding: 0 !important; box-shadow: none; }
      .preview-frame { width: 100%; height: 100vh; min-height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a id="back-link" href="share.html"><h1>Invitation Studio</h1></a>
    <p id="couple-heading">Make a temporary live preview of your invitation</p>
  </header>
  <main class="layout">
    <section class="panel" aria-labelledby="editor-heading">
      <h2 id="editor-heading">Live preview controls</h2>
      <p class="notice">Changes update this preview only. Your saved wedding data and existing guest links are not changed.</p>
      <div class="field">
        <label for="template">Invitation design</label>
        <select id="template">
          <option value="template-01">Template 1</option><option value="template-02">Template 2</option>
          <option value="template-03">Template 3</option><option value="template-04">Template 4</option>
          <option value="template-05">Template 5</option><option value="template-06">Template 6</option>
          <option value="template-07">Template 7</option><option value="template-08">Template 8</option>
          <option value="template-09">Template 9</option><option value="template-10">Template 10</option>
        </select>
      </div>
      <div class="field"><label for="bride">Bride's name</label><input id="bride" maxlength="100" autocomplete="off"></div>
      <div class="field"><label for="groom">Groom's name</label><input id="groom" maxlength="100" autocomplete="off"></div>
      <div class="field"><label for="date">Wedding date</label><input id="date" type="date"></div>
      <div class="field"><label for="venue">Venue</label><input id="venue" maxlength="180" autocomplete="off"></div>
      <div class="field">
        <label for="palette">Colour mood</label>
        <select id="palette">
          <option value="royal">Royal maroon & gold</option><option value="emerald">Emerald & gold</option>
          <option value="navy">Navy & gold</option><option value="rose">Rose & gold</option>
        </select>
      </div>
      <div class="field">
        <label for="font">Preview font</label>
        <select id="font"><option value="inherit">Original design font</option><option value="Georgia, serif">Georgia</option><option value="'Cormorant Garamond', Georgia, serif">Cormorant Garamond</option><option value="'Playfair Display', Georgia, serif">Playfair Display</option></select>
      </div>
      <div class="field">
        <label for="language">Invitation language</label>
        <select id="language"><option value="en">English</option><option value="bn">বাংলা</option><option value="hi">हिन्दी</option><option value="ur">اردو</option></select>
      </div>
      <fieldset><legend>Wedding events</legend><div class="events" id="events"></div><button id="add-event" type="button">Add event</button></fieldset>
    </section>
    <section class="preview-panel" aria-labelledby="preview-heading" style="padding:16px">
      <div class="toolbar"><h2 id="preview-heading">Invitation preview</h2><span id="preview-status" role="status" aria-live="polite">Loading wedding…</span><button id="print-preview" type="button">Print / save as PDF</button></div>
      <iframe class="preview-frame" id="preview" title="Live invitation preview" sandbox referrerpolicy="no-referrer"></iframe>
    </section>
  </main>
  <script type="module">
    import { fetchWeddingBySlug } from './api.js';
    import { localizeHtml } from './i18n.js';

    const params = new URLSearchParams(location.search);
    const slug = (params.get('w') || '').trim();
    const fields = {
      template: document.getElementById('template'),
      bride: document.getElementById('bride'),
      groom: document.getElementById('groom'),
      date: document.getElementById('date'),
      venue: document.getElementById('venue'),
      palette: document.getElementById('palette'),
      font: document.getElementById('font'),
      language: document.getElementById('language')
    };
    const eventRoot = document.getElementById('events');
    const frame = document.getElementById('preview');
    const status = document.getElementById('preview-status');
    document.getElementById('print-preview').addEventListener('click', () => {
      status.textContent = 'In the print dialog, choose “Save as PDF” for a PDF file.';
      window.print();
    });
    const paletteValues = {
      royal: { hue: 0, colors: { primary: '#7a1426', primary_dark: '#3f0713', accent: '#b98a2f', paper_top: '#FFFDF8', paper_bottom: '#F2DFBF', text: '#3b1a1f' } },
      emerald: { hue: 112, colors: { primary: '#0f4d3a', primary_dark: '#052b20', accent: '#b98a2f', paper_top: '#FBFFF9', paper_bottom: '#E4EFD9', text: '#14291f' } },
      navy: { hue: 218, colors: { primary: '#1b2f5e', primary_dark: '#0a1633', accent: '#b98a2f', paper_top: '#FCFDFF', paper_bottom: '#E3E8F2', text: '#16203a' } },
      rose: { hue: 328, colors: { primary: '#9c2f55', primary_dark: '#55132d', accent: '#b98a2f', paper_top: '#FFFBFC', paper_bottom: '#F5DDE3', text: '#3a1824' } }
    };
    const templateIds = new Set(Array.from(fields.template.options, option => option.value));
    let wedding = null;
    let events = [];
    let renderSequence = 0;

    function safeDate(value) {
      const raw = String(value || '').trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return isValidIsoDate(raw) ? raw : '';
      const namedMonth = raw.match(/^(\d{1,2})[\s/-]+([A-Za-z]{3,9})[\s/-]+(\d{4})$/);
      if (namedMonth) {
        const month = new Date(`${namedMonth[2]} 1, 2000`).getMonth();
        if (!Number.isNaN(month)) {
          const iso = `${namedMonth[3]}-${String(month + 1).padStart(2, '0')}-${namedMonth[1].padStart(2, '0')}`;
          return isValidIsoDate(iso) ? iso : '';
        }
      }
      const numericDate = raw.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
      if (numericDate) {
        const iso = `${numericDate[3]}-${numericDate[2].padStart(2, '0')}-${numericDate[1].padStart(2, '0')}`;
        return isValidIsoDate(iso) ? iso : '';
      }
      const parsed = new Date(raw);
      if (Number.isNaN(parsed.getTime())) return '';
      const local = new Date(parsed.getTime() - parsed.getTimezoneOffset() * 60000);
      const iso = local.toISOString().slice(0, 10);
      return isValidIsoDate(iso) ? iso : '';
    }

    function isValidIsoDate(value) {
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return false;
      const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      return date.getFullYear() === Number(match[1])
        && date.getMonth() === Number(match[2]) - 1
        && date.getDate() === Number(match[3]);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function renderEventEditors() {
      eventRoot.replaceChildren();
      if (!events.length) events = [{ event_name: '', event_date: '', event_time: '' }];
      events.forEach((event, index) => {
        const card = document.createElement('div');
        card.className = 'event-editor';
        const heading = document.createElement('div');
        heading.className = 'event-editor-head';
        const title = document.createElement('h3');
        title.textContent = `Event ${index + 1}`;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Remove';
        remove.setAttribute('aria-label', `Remove event ${index + 1}`);
        remove.addEventListener('click', () => {
          if (events.length === 1) events[0] = { event_name: '', event_date: '', event_time: '' };
          else events.splice(index, 1);
          renderEventEditors();
          renderPreview();
        });
        heading.append(title, remove);
        const grid = document.createElement('div');
        grid.className = 'event-grid';
        [['event_name', 'Event name', 'text'], ['event_date', 'Date', 'date'], ['event_time', 'Time', 'text']].forEach(([key, label, type]) => {
          const input = document.createElement('input');
          input.type = type;
          input.setAttribute('aria-label', `${label} for event ${index + 1}`);
          input.placeholder = label;
          input.value = key === 'event_date' ? safeDate(event[key]) : String(event[key] || '');
          input.addEventListener('input', () => {
            events[index][key] = input.value;
            renderPreview();
          });
          grid.append(input);
        });
        card.append(heading, grid);
        eventRoot.append(card);
      });
    }

    function invitationData() {
      const selectedPalette = paletteValues[fields.palette.value] || paletteValues.royal;
      return {
        guest: { name: 'Respected Guest', with_family: false, persons: 1 },
        wedding: {
          ...wedding,
          template_id: fields.template.value,
          bride_name: fields.bride.value.trim(),
          groom_name: fields.groom.value.trim(),
          date: fields.date.value,
          venue: fields.venue.value.trim(),
          theme_colors: selectedPalette.colors
        },
        events: events.filter(event => event.event_name || event.event_date || event.event_time)
      };
    }

    async function renderPreview() {
      if (!wedding || !templateIds.has(fields.template.value)) return;
      const sequence = ++renderSequence;
      status.textContent = 'Updating preview…';
      try {
        const module = await import(`./templates/${fields.template.value}.js`);
        const data = invitationData();
        const html = localizeHtml(module.default(data), fields.language.value);
        const selectedPalette = paletteValues[fields.palette.value] || paletteValues.royal;
        const font = fields.font.value === 'inherit' ? '' : `font-family:${fields.font.value} !important;`;
        const hue = fields.template.value === 'template-02' ? 0 : selectedPalette.hue;
        const direction = fields.language.value === 'ur' ? 'rtl' : 'ltr';
        const multiPageOverrides = {
          'template-02': '.ru{position:relative!important;inset:auto!important;height:auto!important;min-height:100vh;overflow:visible!important}.vp{height:auto!important}.sp{position:relative!important;inset:auto!important;visibility:visible!important;opacity:1!important;transform:none!important;min-height:100vh;margin:12px auto}',
          'template-03': '.rj{position:relative!important;inset:auto!important;height:auto!important;min-height:100vh;overflow:visible!important;display:block!important}.vp{height:auto!important;min-height:100vh;margin:auto}.pg{position:relative!important;inset:auto!important;display:block!important;overflow:visible!important;visibility:visible!important;opacity:1!important;height:auto!important}.pa{display:block!important;width:100%;min-height:100vh}.cd{height:auto!important;min-height:calc(100vh - 20px)}.nv,.dr{display:none!important}',
          'template-04': '.rj{position:relative!important;inset:auto!important;height:auto!important;min-height:100vh;overflow:visible!important;display:block!important}.vp{height:auto!important;min-height:100vh;margin:auto}.pg{position:relative!important;inset:auto!important;display:block!important;overflow:visible!important;visibility:visible!important;opacity:1!important;height:auto!important}.pa{display:block!important;width:100%;min-height:100vh}.cd{height:auto!important;min-height:calc(100vh - 20px)}.nv,.sv{display:none!important}'
        };
        const layoutOverrides = multiPageOverrides[fields.template.value] || '';
        const documentHtml = `<!doctype html><html lang="${fields.language.value}" dir="${direction}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;min-height:100%;height:auto;overflow-x:hidden;overflow-y:auto}body{background:#16050a}.studio-preview{position:relative;width:100%;min-height:100vh;height:auto;overflow:visible;filter:hue-rotate(${hue}deg);print-color-adjust:exact;-webkit-print-color-adjust:exact;direction:${direction}}.studio-preview *{${font}}@media print{html,body{width:100%;min-height:100%;height:auto;overflow:visible}.studio-preview{height:auto;filter:none}}</style></head><body><div class="studio-preview">${html}</div><style>${layoutOverrides}</style></body></html>`;
        if (sequence !== renderSequence) return;
        frame.srcdoc = documentHtml;
        status.textContent = 'Preview updated';
      } catch (error) {
        console.error('Invitation preview failed:', error);
        status.textContent = 'Could not render this design.';
      }
    }

    [fields.bride, fields.groom, fields.date, fields.venue].forEach(field => field.addEventListener('input', renderPreview));
    [fields.template, fields.palette, fields.font, fields.language].forEach(field => field.addEventListener('change', renderPreview));
    document.getElementById('add-event').addEventListener('click', () => {
      events.push({ event_name: '', event_date: '', event_time: '' });
      renderEventEditors();
      renderPreview();
    });

    async function initialize() {
      if (!slug) throw new Error('Open the studio from a wedding share link so the wedding can be identified.');
      const back = new URL('share.html', location.href);
      back.searchParams.set('w', slug);
      if (['en', 'bn', 'hi', 'ur'].includes(params.get('lang'))) {
        back.searchParams.set('lang', params.get('lang'));
      }
      document.getElementById('back-link').href = back.href;
      const payload = await fetchWeddingBySlug(slug);
      wedding = payload.wedding;
      events = payload.events.filter(event => event && typeof event === 'object').map(event => ({ ...event }));
      const bride = String(wedding.bride_name || '');
      const groom = String(wedding.groom_name || '');
      document.getElementById('couple-heading').textContent = `${bride} & ${groom} · Preview only`;
      fields.template.value = templateIds.has(wedding.template_id) ? wedding.template_id : 'template-02';
      fields.bride.value = bride;
      fields.groom.value = groom;
      fields.date.value = safeDate(wedding.date);
      fields.venue.value = String(wedding.venue || '');
      fields.language.value = ['en', 'bn', 'hi', 'ur'].includes(params.get('lang')) ? params.get('lang') : 'en';
      renderEventEditors();
      await renderPreview();
    }

    initialize().catch(error => {
      console.error('Invitation studio failed to load:', error);
      status.textContent = error.message || 'Wedding information could not be loaded.';
      frame.srcdoc = `<!doctype html><html><body style="margin:0;padding:2rem;background:#16050a;color:#f7e5b5;font:16px Georgia,serif">${escapeHtml(error.message || 'Invitation preview unavailable.')}</body></html>`;
    });
  </script>
</body>
</html>
